<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ReconX — Reports Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <style>body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}</style>
  </head>
  <body class="bg-[#F9FAFB] text-gray-900 min-h-screen">
    <header class="bg-[#27343d] flex items-center justify-between px-6 py-3">
      <div class="flex items-center space-x-2">
        <img src="images/gcblogo.png" alt="logo" class="w-8 h-8"/>
        <h1 class="text-yellow-400 font-extrabold text-lg">RECON <span class="text-white">X</span></h1>
      </div>
      <nav class="flex items-center space-x-4">
        <a href="dashboard.html" class="text-sm text-white">Dashboard</a>
        <a href="upload_enhanced.html" class="text-sm text-white/90 hover:text-yellow-300">Upload</a>
        <a href="Report.html" class="text-sm text-white/90 hover:text-yellow-300">Reports</a>
        <a href="audit.html" class="text-sm text-white/90 hover:text-yellow-300">Audit</a>
        <a href="users.html" class="text-sm text-white/90 hover:text-yellow-300">Users</a>
      </nav>
    </header>

    <main class="max-w-6xl mx-auto p-6">
      <section class="bg-white p-6 rounded-lg shadow-sm border">
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-semibold">Reports Dashboard</h2>
          <div class="text-sm text-gray-500">System status: <span id="system-status">loading...</span></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="p-4 border rounded">
            <h3 class="font-semibold">Latest Reconciliation</h3>
            <p id="latest-run" class="text-sm text-gray-600 mt-2">No runs yet.</p>
          </div>
          <div class="p-4 border rounded">
            <h3 class="font-semibold">Uploaded Files</h3>
            <p id="upload-count" class="text-sm text-gray-600 mt-2">0 uploaded</p>
          </div>
          <div class="p-4 border rounded">
            <h3 class="font-semibold">Match Rate</h3>
            <p id="match-rate" class="text-sm text-gray-600 mt-2">—</p>
          </div>
        </div>

        <div class="mt-6">
          <button id="refreshBtn" class="px-4 py-2 bg-yellow-400 text-white rounded hover:bg-yellow-500">Refresh</button>
        </div>
      </section>

      <section class="bg-white p-6 rounded-lg shadow-sm border mt-6">
        <h3 class="font-semibold mb-3">Recent Runs</h3>
        <div id="runsTable" class="text-sm text-gray-700">No runs to display.</div>
      </section>
    </main>

    <script>
      async function fetchHealth(){
        try{
          const res = await fetch('/api/health');
          if(!res.ok) throw new Error('no status');
          const j = await res.json();
          document.getElementById('system-status').textContent = j.status || 'ok';
          document.getElementById('upload-count').textContent = (j.active_tasks!==undefined)? j.active_tasks + ' active tasks' : '—';
        }catch(e){
          document.getElementById('system-status').textContent = 'unavailable';
        }
      }
      document.getElementById('refreshBtn').addEventListener('click', fetchHealth);
      fetchHealth();
    </script>

    <!-- Footer -->
    <footer class="bg-[#27343d] border-t mt-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center text-sm text-gray-300">
                <div class="text-white font-medium">
                    GCB BANK PLC - GL BALANCING & RECONCILIATION
                </div>
                <div class="flex items-center space-x-4 text-white">
                    <span class="font-medium">VERSION 1.0</span>
                    <span class="flex items-center space-x-2">
                        <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                        <span class="font-medium">SYSTEM STATUS:</span>
                        <span id="systemStatusIndicator" class="font-bold text-green-400">ONLINE</span>
                    </span>
                </div>
            </div>
        </div>
    </footer>

    <script>
        // System Status Indicator - Dynamic coloring
        document.addEventListener('DOMContentLoaded', function() {
            const statusIndicator = document.getElementById('systemStatusIndicator');
            const currentStatus = statusIndicator.textContent.trim();
            
            if (currentStatus === 'ONLINE') {
                statusIndicator.className = 'font-bold text-green-400';
            } else if (currentStatus === 'OFFLINE') {
                statusIndicator.className = 'font-bold text-red-500';
            }

            window.updateSystemStatus = function(newStatus) {
                const status = newStatus.toUpperCase();
                statusIndicator.textContent = status;
                if (status === 'ONLINE') {
                    statusIndicator.className = 'font-bold text-green-400';
                } else if (status === 'OFFLINE') {
                    statusIndicator.className = 'font-bold text-red-500';
                }
            };
        });
    </script>
  </body>
</html>
