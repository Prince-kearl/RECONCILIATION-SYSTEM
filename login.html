<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Login - RECONX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    .fade-in { animation: fadeIn 300ms ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
 </head>
<body class="bg-[#30404a] min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
 <div id="notification-container" class="fixed top-3 right-3 z-50 space-y-2"></div>
 <main class="w-full max-w-md">
  <section class="bg-white rounded-lg shadow-lg p-6 sm:p-8 fade-in" aria-labelledby="loginTitle">
   <div class="flex flex-col items-center">
    <img src="images/reconxlogo.png" alt="ReconX logo" width="96" height="96" class="mb-3"/>
    <h1 id="loginTitle" class="text-xl sm:text-2xl font-extrabold text-gray-900">Welcome back to ReconX</h1>
    <p class="text-gray-600 text-xs sm:text-sm mt-1 text-center">
      Sign in to continue to your GL reconciliation dashboard.
    </p>
   </div>

   <form id="loginForm" class="mt-6" novalidate autocomplete="on" aria-describedby="formHelp">
    <div class="mb-4">
     <label for="username" class="block text-xs font-semibold text-gray-700 mb-1">Username or Email</label>
     <input id="username" name="username" type="text" inputmode="email" autocapitalize="none" autocomplete="username" required aria-required="true"
      class="w-full border border-gray-300 bg-white text-gray-900 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
    </div>

    <div class="mb-2 relative">
     <label for="password" class="block text-xs font-semibold text-gray-700 mb-1">Password</label>
     <input id="password" name="password" type="password" autocomplete="current-password" required aria-required="true"
      class="peer w-full border border-gray-300 bg-white text-gray-900 rounded px-3 py-2 pr-9 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400" />
     <button type="button" id="togglePassword" aria-label="Toggle password visibility"
      class="absolute right-2 top-7 text-gray-500 hover:text-gray-700"><i class="far fa-eye"></i></button>
     <div id="passwordStrength" class="mt-2 h-1 rounded bg-gray-200 overflow-hidden" aria-hidden="true">
      <div id="strengthBar" class="h-1 w-0 bg-red-500 transition-all"></div>
     </div>
     <p id="strengthLabel" class="text-[10px] mt-1 text-gray-500">Strength: —</p>
    </div>

    <div class="mt-3 flex items-center justify-between gap-3">
     <label class="inline-flex items-center text-xs text-gray-700 select-none">
      <input id="rememberMe" type="checkbox"
       class="w-4 h-4 text-yellow-500 border-gray-300 rounded focus:ring-yellow-400"/> <span class="ml-2">Remember me</span>
     </label>
    </div>

    <div class="mt-4 flex items-start gap-2">
     <input id="mfa" type="checkbox"
      class="mt-0.5 w-4 h-4 text-yellow-500 border-gray-300 rounded focus:ring-yellow-400"
      aria-describedby="mfaTip"/>
     <div class="flex-1">
      <label for="mfa" class="text-xs font-semibold text-gray-700">Use Multi-Factor Authentication</label>
      <p id="mfaTip" class="text-[10px] text-gray-500">Adds a one-time code from your authenticator app or SMS.</p>
     </div>
    </div>

    <div id="otpGroup" class="mt-2 hidden">
     <label for="otp" class="block text-xs font-semibold text-gray-700 mb-1">One-Time Password (OTP)</label>
     <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{4,8}"
      aria-describedby="otpHelp"
      class="w-full border border-gray-300 bg-white text-gray-900 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-yellow-400"/>
     <p id="otpHelp" class="text-[10px] text-gray-500">Enter the 6-digit code if MFA is enabled.</p>
    </div>

    <div role="alert" id="formError" class="hidden mt-3 text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded px-3 py-2"></div>

    <button id="btnLogin" type="submit"
     class="mt-4 w-full bg-[#1c2930] text-white font-semibold py-2 rounded hover:bg-[#162026] transition-colors text-sm disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2">
     <span>Login</span>
     <i id="btnSpinner" class="fas fa-spinner fa-spin hidden"></i>
    </button>

    <div id="formHelp" class="mt-3 flex items-center justify-between text-xs">
     <a href="#" id="linkForgot" class="text-blue-600 hover:underline" role="link" aria-label="Forgot password">Forgot Password?</a>
     <a href="#" id="linkSupport" class="text-gray-700 hover:underline" role="link" aria-label="Contact system administrator">Need access? Contact your System Administrator.</a>
    </div>
   </form>
  </section>
 </main>

 <script>
  const API_BASE_URL = 'http://localhost:5000/api';
  const API_ENDPOINTS = window.API_ENDPOINTS || { login: '/auth/login' };
  const IT_SUPPORT_URL = (window.APP_LINKS && window.APP_LINKS.itSupport) || '#';
  document.getElementById('linkSupport').setAttribute('href', IT_SUPPORT_URL);

  function showToast(message, type='info'){ 
    const host=document.getElementById('notification-container'); 
    const div=document.createElement('div'); 
    const c= type==='success'?'bg-green-600': type==='error'?'bg-red-600': type==='warning'?'bg-yellow-600':'bg-gray-800'; 
    div.className=`${c} text-white text-xs rounded px-3 py-2 shadow`; 
    div.textContent=message; 
    host.appendChild(div); 
    setTimeout(()=>div.remove(), 3500); 
  }

  function sanitize(str){ 
    return String(str||'').replace(/[<>"'`]/g, s => ({'<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;','`':'&#96;'}[s])); 
  }

  async function fetchData(path, { method='POST', headers={}, body, raw=false }={}) {
    const url = path.startsWith('http') ? path : `${API_BASE_URL}${path}`;
    const res = await fetch(url, { method, headers: { 'Content-Type':'application/json', ...headers }, body });
    return raw ? res : res.json();
  }

  function updateStrength(pw){
    const bar=document.getElementById('strengthBar'); 
    const label=document.getElementById('strengthLabel');
    let score=0; 
    if(pw.length>=8) score++; 
    if(/[A-Z]/.test(pw)) score++; 
    if(/[0-9]/.test(pw)) score++; 
    if(/[^A-Za-z0-9]/.test(pw)) score++;
    const widths=['w-1/5','w-2/5','w-3/5','w-4/5','w-full']; 
    bar.className=`h-1 ${['bg-red-500','bg-yellow-500','bg-yellow-500','bg-green-500','bg-green-600'][score]} ${widths[Math.min(score,4)]}`;
    label.textContent = `Strength: ${['very weak','weak','medium','strong','very strong'][score]}`;
  }

  function togglePasswordVisibility(){ 
    const pw=document.getElementById('password'); 
    const icon=document.querySelector('#togglePassword i'); 
    if(pw.type==='password'){ 
      pw.type='text'; 
      icon.className='far fa-eye-slash'; 
    } else { 
      pw.type='password'; 
      icon.className='far fa-eye'; 
    } 
  }

  function setLoading(loading){ 
    const btn=document.getElementById('btnLogin'); 
    const spin=document.getElementById('btnSpinner'); 
    btn.disabled=loading; 
    spin.classList.toggle('hidden', !loading); 
  }

  async function authenticateUser(username, password, otp){
    try{
      const res = await fetchData(API_ENDPOINTS.login, {
        method: 'POST',
        body: JSON.stringify({ username, password, otp })
      });
      if(res && res.token){
        try { localStorage.setItem('authToken', res.token); } catch {}
        return { ok:true, user: res.user };
      }
      if(res && res.mfa_required){
        return { ok:false, mfaRequired:true, message: res.message || 'MFA required' };
      }
      return { ok:false, message: (res && (res.error || res.message)) || 'Invalid credentials' };
    } catch(e){ 
      return { ok:false, message:'Network error' }; 
    }
  }

  function persistRememberMe(username){ 
    try{ 
      if(document.getElementById('rememberMe').checked){ 
        localStorage.setItem('rememberUser', username); 
      } else { 
        localStorage.removeItem('rememberUser'); 
      } 
    } catch {} 
  }

  function hydrateRemembered(){ 
    const u=localStorage.getItem('rememberUser'); 
    if(u){ document.getElementById('username').value = u; } 
  }

  document.getElementById('togglePassword').addEventListener('click', togglePasswordVisibility);
  document.getElementById('password').addEventListener('input', (e)=> updateStrength(e.target.value));

  // MFA checkbox is informational only
  const mfaCb=document.getElementById('mfa'); 
  mfaCb.disabled=true; 
  mfaCb.title='MFA is enforced by your organization when required.';

  // Lockout handling
  function getFails(){ try{ return Number(localStorage.getItem('loginFails')||'0'); }catch{ return 0; } }
  function setFails(n){ try{ localStorage.setItem('loginFails', String(n)); localStorage.setItem('loginLastFail', String(Date.now())); }catch{} }
  function isLocked(){ 
    try{ 
      const fails=getFails(); 
      const last=Number(localStorage.getItem('loginLastFail')||'0'); 
      if(fails>=5){ 
        const elapsed=Date.now()-last; 
        return elapsed < 5*60*1000; 
      } 
      return false; 
    }catch{ return false; } 
  }

  document.getElementById('loginForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const errEl=document.getElementById('formError'); 
    errEl.classList.add('hidden'); 
    errEl.textContent='';
    if(isLocked()){ 
      errEl.textContent='Too many attempts. Account temporarily locked. Please try again later.'; 
      errEl.classList.remove('hidden'); 
      return; 
    }
    const username=sanitize(document.getElementById('username').value.trim());
    const password=document.getElementById('password').value;
    const otpField=document.getElementById('otp');
    const otp = !document.getElementById('otpGroup').classList.contains('hidden') ? sanitize(otpField.value.trim()) : undefined;
    if(!username || !password){ 
      errEl.textContent='Invalid login attempt. Please try again.'; 
      errEl.classList.remove('hidden'); 
      return; 
    }
    setLoading(true);
    const res = await authenticateUser(username, password, otp);
    setLoading(false);
    if(res.ok){
      persistRememberMe(username);
      showToast('Login successful','success');
      window.location.href = 'dashboard.html';
    } else if(res.mfaRequired){
      document.getElementById('otpGroup').classList.remove('hidden'); 
      mfaCb.checked = true;
      errEl.textContent = 'Invalid login attempt. Please try again.'; 
      errEl.classList.remove('hidden');
    } else {
      setFails(getFails()+1);
      if(isLocked()){ 
        errEl.textContent='Too many attempts. Account temporarily locked. Please try again later.'; 
      } else { 
        errEl.textContent = 'Invalid login attempt. Please try again.'; 
      }
      errEl.classList.remove('hidden'); 
      showToast(errEl.textContent, 'error');
    }
  });

  // Accessibility: preload remembered user and reset strength bar
  hydrateRemembered(); 
  updateStrength('');

bn  // Remember me warning
  const warn=document.createElement('p'); 
  warn.className='text-[10px] mt-1 text-yellow-700'; 
  warn.textContent='Do not use on shared or public computers.'; 
  document.getElementById('rememberMe').parentElement.appendChild(warn);
 </script>
 </body>
</html>
